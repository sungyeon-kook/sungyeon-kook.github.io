    Projects:
      - name: Low-Spatial-Cost CCZ Magic-State Factory
        start_date: 2025
        end_date: present
        summary: Designed a compact surface-code CCZ magic-state factory based on Pauli-product measurements.
        highlights:
          - Converted the [[8,3,2]] CCZ distillation circuit into eight Z-basis pi/8 Pauli-product joint measurements.
          - Reduced the factory from 12 to 4 persistent logical patches.
          - Reduced spatial cost by 71.4 percent and space-time volume by 37.7 percent.
      - name: Surface-Code Decoder and Code Switching
        start_date: 2024
        end_date: present
        summary: Developed decoding and code-switching methods for fault-tolerant quantum computing.
        highlights:
          - Built a Stim-PyMatching decoding pipeline for rotated surface codes.
          - Developed an erasure-aware MWPM decoder using dynamically reweighted matching graphs.
          - Proposed a fault-tolerant Bacon-Shor-to-surface-code switching protocol.
      - name: Architecture-Aware Quantum Circuit Mapping and Scheduling
        start_date: 2024
        end_date: 2025
        highlights:
          - Designed Heavy-Hex surface-code mapping strategies.
          - Developed a QODG-based scheduling framework for checkerboard architectures.
          - Implemented a Greedy DAG Qiskit transpiler pass, reducing average circuit depth from 73 to 61.4.
      - name: Fault-Tolerant Resource Analysis for Quantum Modular Reduction
        start_date: 2025
        end_date: present
        highlights:
          - Developed a surface-code resource-estimation framework incorporating code distance, logical-error requirements, magic-state factories, decoder throughput, and backlog.
          - Formulated a runtime model incorporating T-depth, feed-forward latency, and decoder performance.
          - Reduced estimated execution time from 53.77 ms to 30.05 ms under Sparse Blossom decoding.
      - name: Experimental Superconducting Quantum Computing
        start_date: 2024
        end_date: 2025
        highlights:
          - Developed Python-based experimental-control software using Zurich Instruments hardware.
          - Performed spectroscopy, randomized benchmarking, DRAG calibration, and cross-resonance gate experiments.

